<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>
<title>荷花與水位 AR 實驗</title>

<!-- A-Frame 與 MindAR 影像辨識套件 -->
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
  }

  [hidden] {
    display: none !important;
  }

  .panel {
    position: fixed;
    z-index: 10;
    left: 10px;
    right: 10px;
    max-width: 480px;
    margin: auto;
    background: rgba(255, 255, 255, 0.95);
    padding: 14px;
    border-radius: 16px;
    box-shadow: 0 4px 22px rgba(0, 0, 0, 0.14);
    backdrop-filter: blur(6px);
  }

  #top {
    top: max(10px, env(safe-area-inset-top));
  }

  #bottom {
    bottom: max(10px, env(safe-area-inset-bottom));
  }

  h1 {
    font-size: 19px;
    color: #155744;
    margin: 0 0 7px;
  }

  p {
    font-size: 14px;
    line-height: 1.6;
    margin: 6px 0;
    color: #222;
  }

  button {
    background: #176b57;
    color: #fff;
    border: 0;
    border-radius: 9px;
    padding: 11px 13px;
    font: inherit;
    cursor: pointer;
    touch-action: manipulation;
    transition: background-color 0.15s ease;
  }

  button:active:not(:disabled) {
    background: #114f40;
  }

  button:disabled {
    background: #888;
    cursor: not-allowed;
  }

  #start {
    margin-top: 10px;
    width: 100%;
    font-weight: bold;
  }

  .row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  label {
    font-weight: bold;
    color: #155744;
  }

  input[type="range"] {
    width: 100%;
    height: 38px;
    accent-color: #176b57;
    touch-action: pan-x;
  }

  .note {
    font-size: 12px;
    color: #666;
  }

  .row button {
    flex: 1;
  }

  #result {
    min-height: 44px;
    color: #155744;
    font-weight: 500;
  }

  #levelValue {
    font-weight: bold;
    color: #176b57;
  }

  #status {
    overflow-wrap: anywhere;
  }
</style>

<script>
/**
 * 荷花水槽互動元件 (tank-interaction)
 * ------------------------------------------------------------
 * 1. 讀取 TankRoot 的水位基準與深度範圍（具備預設值備援）
 * 2. 調整半透明材質（TankGlass、WaterVolume、WaterTop、SoilMud、WaterDroplet）渲染順序
 * 3. 控制水體縮放與水面高度；荷花為挺水性植物，根部固定在槽底泥土 (this.base)
 */
AFRAME.registerComponent('tank-interaction', {
  init: function () {
    this.ready = false;
    this.depth = 0.42;
    this.targetDepth = 0.42;

    this.el.addEventListener('model-loaded', () => {
      try {
        const mesh = this.el.getObject3D('mesh');

        this.body = mesh.getObjectByName('WaterBody');
        this.surface = mesh.getObjectByName('WaterSurface');
        this.plant = mesh.getObjectByName('LotusRoot');
        const tank = mesh.getObjectByName('TankRoot');

        if (!this.body || !this.surface || !this.plant || !tank) {
          throw new Error(
            '模型缺少互動物件，請確認已匯出正確的 lotus_tank.glb。'
          );
        }

        // 若匯出時未勾選 Custom Properties，自動採用與建模腳本一致的預設值
        this.base = Number(tank.userData.water_base ?? 0.14);
        this.minDepth = Number(tank.userData.water_min_depth ?? 0.20);
        this.maxDepth = Number(tank.userData.water_max_depth ?? 0.65);

        // 修正半透明材質與植物花瓣/荷葉的雙面渲染
        mesh.traverse(obj => {
          if (!obj.isMesh) return;

          const materials = Array.isArray(obj.material)
            ? obj.material
            : [obj.material];

          for (const mat of materials) {
            if (!mat) continue;

            // 為純色未帶貼圖的荷花/荷葉材質補充代表性色調（若貼圖未烘焙進 GLB 時可維持清晰層次）
            const fallbackColors = {
              LotusPetal: 0xf05d94,
              LotusBudPetal: 0xe6457d,
              LotusSepal: 0x7aa348,
              LotusLeaf: 0x3b8c2e
            };
            if (!mat.map && fallbackColors[mat.name] !== undefined) {
              mat.color.setHex(fallbackColors[mat.name]);
            }

            // 設定半透明物件的透明度與渲染順序，避免玻璃與水體互相遮擋破圖
            const alphaMap = {
              TankGlass: 0.12,
              WaterVolume: 0.15,
              WaterTop: 0.35,
              SoilMud: 0.88,
              WaterDroplet: 0.65
            };

            if (alphaMap[mat.name] !== undefined) {
              mat.transparent = true;
              mat.opacity = alphaMap[mat.name];
              mat.needsUpdate = true;
            }

            if (mat.transparent || mat.opacity < 1) {
              mat.depthWrite = false;
              mat.side = AFRAME.THREE.DoubleSide;

              if (mat.name === 'TankGlass') {
                obj.renderOrder = 4;
              } else if (mat.name === 'WaterTop' || mat.name === 'WaterVolume') {
                obj.renderOrder = 3;
              } else {
                obj.renderOrder = 2;
              }
            } else {
              mat.side = AFRAME.THREE.DoubleSide;
            }
          }
        });

        this.ready = true;
        this.setLevel(50);
        this.depth = this.targetDepth;
        this.applyDepth();

        this.el.dataset.tankReady = 'true';
        this.el.emit('tank-ready', {}, false);

      } catch (error) {
        console.error(error);
        this.el.dataset.tankError = error.message;
        this.el.emit('tank-error', { message: error.message }, false);
      }
    });
  },

  setLevel: function (percent) {
    if (!this.ready) return;
    const p = Math.min(100, Math.max(0, Number(percent))) / 100;
    this.targetDepth = this.minDepth + (this.maxDepth - this.minDepth) * p;
  },

  applyDepth: function () {
    // 改變水體高度，底部位置保持固定在泥土表面 (this.base)
    this.body.position.y = this.base;
    this.body.scale.y = this.depth;

    // 水面位於水體最上方
    this.surface.position.y = this.base + this.depth;

    // 荷花為挺水性植物：根與蓮藕固定於槽底泥土中，不隨水面漂浮
    this.plant.position.y = this.base;
  },

  tick: function (time, delta) {
    if (!this.ready) return;
    // 指數平滑過渡，使水位升降流暢自然
    const alpha = 1 - Math.exp(-Math.min(delta || 16, 100) / 140);
    this.depth += (this.targetDepth - this.depth) * alpha;
    this.applyDepth();
  }
});
</script>
</head>

<body>

<!-- 頂部狀態與啟動面板 -->
<div id="top" class="panel">
  <h1>荷花與水位 AR 實驗</h1>

  <p id="status" role="status" aria-live="polite">
    正在載入立體荷花水槽……
  </p>

  <button id="start" disabled>載入中</button>

  <p class="note">
    荷花外形與水槽比例為教學示意；水位升降為互動模擬。
  </p>
</div>

<!-- 底部互動控制面板 -->
<div id="bottom" class="panel" hidden>
  <div class="row">
    <label for="level">調整水位</label>
    <span id="levelValue">50%</span>
  </div>

  <input
    id="level"
    type="range"
    min="0"
    max="100"
    value="50"
    step="1"
    aria-label="水位，相對於可調整範圍的百分比"
  >

  <div class="row">
    <button type="button" data-level="0">低水位</button>
    <button type="button" data-level="50">中水位</button>
    <button type="button" data-level="100">高水位</button>
  </div>

  <p id="result">
    試著改變水位，觀察荷花葉片與花朵的位置變化。
  </p>

  <div class="row">
    <button type="button" id="rotate">旋轉</button>
    <button type="button" id="view">換角度</button>
    <button type="button" id="reset">重設</button>
  </div>

  <p class="note">
    觀察：荷花會隨水面上下漂浮嗎？它的蓮藕與根固定在哪裡？
  </p>
</div>

<!-- MindAR + A-Frame 3D 場景 -->
<a-scene
  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: false;
    uiLoading: no;
    uiScanning: no;
    uiError: no;
  "
  renderer="
    colorManagement: true;
    alpha: true;
  "
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  loading-screen="enabled: false"
>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity light="type: ambient; intensity: 1.15"></a-entity>
  <a-entity light="type: directional; intensity: 1.25" position="1 2.5 3"></a-entity>

  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-entity id="spin" position="0 -0.1 0.02">
      <a-entity id="tilt" rotation="70 0 0">
        <a-entity
          id="tank"
          gltf-model="url(./lotus_tank.glb)"
          scale="0.52 0.52 0.52"
          tank-interaction
        ></a-entity>
      </a-entity>
    </a-entity>
  </a-entity>
</a-scene>

<script>
const scene = document.querySelector('a-scene');
const tank = document.querySelector('#tank');

const status = document.querySelector('#status');
const start = document.querySelector('#start');
const bottom = document.querySelector('#bottom');

const level = document.querySelector('#level');
const value = document.querySelector('#levelValue');
const result = document.querySelector('#result');

let sceneReady = Boolean(scene.hasLoaded);
let modelReady = false;
let failed = false;
let starting = false;
let running = false;

let angle = 0;
let viewIndex = 0;
const views = [70, 90, 40];

function ready() {
  if (failed || running || starting) return;
  if (sceneReady && modelReady) {
    start.disabled = false;
    start.textContent = '啟動 AR 鏡頭';
    status.textContent = '水槽已載入。啟動鏡頭後，請掃描荷花圖卡。';
  }
}

function fail(message) {
  failed = true;
  running = false;
  starting = false;

  status.textContent = message;
  start.hidden = false;
  start.disabled = true;
  start.textContent = '請修正後重新整理';
  bottom.hidden = true;

  try {
    scene.systems['mindar-image-system']?.stop();
  } catch (error) {
    console.warn(error);
  }
}

scene.addEventListener('loaded', () => {
  sceneReady = true;
  ready();
});

tank.addEventListener('tank-ready', () => {
  modelReady = true;
  ready();
});

tank.addEventListener('tank-error', event => {
  fail(event.detail.message);
});

tank.addEventListener('model-error', () => {
  fail('水槽載入失敗，請確認 lotus_tank.glb 已上傳至同一資料夾。');
});

if (tank.dataset.tankReady === 'true') modelReady = true;
if (tank.dataset.tankError) fail(tank.dataset.tankError);
ready();

scene.addEventListener('arReady', () => {
  if (failed) return;
  starting = false;
  running = true;

  start.hidden = true;
  bottom.hidden = false;
  status.textContent = '請對準荷花圖卡，辨識後拖動水位滑桿。';
});

scene.addEventListener('arError', () => {
  fail('無法啟動鏡頭，請確認相機權限，以及 targets.mind 是否存在。');
});

start.addEventListener('click', async () => {
  if (failed || starting || running || !modelReady || !sceneReady) return;

  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
    status.textContent = '請使用手機瀏覽器開啟 HTTPS 網址，並允許相機權限。';
    return;
  }

  starting = true;
  start.disabled = true;
  start.textContent = '啟動中……';
  status.textContent = '請允許網站使用相機……';

  try {
    await scene.systems['mindar-image-system'].start();
  } catch (error) {
    console.error(error);
    fail('AR 啟動失敗：請允許相機權限，並確認 targets.mind 已上傳。');
  }
});

document.querySelector('#target').addEventListener('targetFound', () => {
  if (!failed) {
    status.textContent = '辨識成功！改變水位，觀察荷花與水面的相對位置。';
  }
});

document.querySelector('#target').addEventListener('targetLost', () => {
  if (running) {
    status.textContent = '圖卡離開鏡頭，請重新對準荷花圖卡。';
  }
});

function setLevel(percent) {
  const p = Math.max(0, Math.min(100, Number(percent)));
  level.value = p;
  value.textContent = p + '%';

  tank.components['tank-interaction']?.setLevel(p);

  if (p < 34) {
    result.textContent = '低水位：荷花根與蓮藕固定在泥土中，大部分葉柄與花梗挺出水面。';
  } else if (p > 66) {
    result.textContent = '高水位：水面上升淹沒部分葉柄，但荷花不會隨水面漂浮，仍挺立於水中。';
  } else {
    result.textContent = '中水位：荷花根部固定在槽底泥土，葉片與花朵挺出水面。';
  }
}

level.addEventListener('input', event => {
  setLevel(event.target.value);
});

document.querySelectorAll('[data-level]').forEach(button => {
  button.addEventListener('click', () => {
    setLevel(button.dataset.level);
  });
});

document.querySelector('#rotate').addEventListener('click', () => {
  angle = (angle + 30) % 360;
  document.querySelector('#spin').setAttribute('rotation', `0 0 ${angle}`);
});

document.querySelector('#view').addEventListener('click', () => {
  viewIndex = (viewIndex + 1) % views.length;
  document.querySelector('#tilt').setAttribute('rotation', `${views[viewIndex]} 0 0`);
});

document.querySelector('#reset').addEventListener('click', () => {
  angle = 0;
  viewIndex = 0;
  setLevel(50);
  document.querySelector('#spin').setAttribute('rotation', '0 0 0');
  document.querySelector('#tilt').setAttribute('rotation', '70 0 0');
});

window.addEventListener('pagehide', () => {
  try {
    scene.systems['mindar-image-system']?.stop();
  } catch (error) {
    console.warn(error);
  }
});
</script>

</body>
</html>
